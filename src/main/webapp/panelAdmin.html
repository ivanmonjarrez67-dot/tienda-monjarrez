<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitudes de Vendedor — Tienda Monjarrez</title>
<link rel="icon" href="icon-512.png" type="image/png">
<style>
  :root{
    --bg:#101314;
    --panel:#171b1c;
    --panel-alt:#1d2224;
    --line:#2a3133;
    --text:#e9edee;
    --muted:#8a969a;
    --accent:#3fae82;
    --accent-dim:#2c7a5b;
    --warn:#d98a3d;
    --danger:#c65b4e;
    --mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
    --sans:'Inter','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  header{
    padding:20px 32px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  header .title-block{display:flex;align-items:center;gap:14px;}
  .icon{
    width:30px;
    height:30px;
    border-radius:7px;
    display:block;
    object-fit:cover;
  }
  h1{
    font-size:19px;
    font-weight:600;
    margin:0;
    letter-spacing:0.2px;
  }
  .tag{
    font-family:var(--mono);
    font-size:11px;
    color:var(--accent);
    background:rgba(63,174,130,0.12);
    border:1px solid rgba(63,174,130,0.35);
    padding:2px 8px;
    border-radius:20px;
  }
  .stamp{
    font-family:var(--mono);
    font-size:12px;
    color:var(--muted);
  }
  .header-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .welcome{
    font-family:var(--sans);
    font-size:13px;
    color:var(--text);
  }
  .welcome b{color:var(--accent);font-weight:600;}
  .divider{width:1px;height:18px;background:var(--line);}
  main{padding:24px 32px 60px;max-width:1180px;margin:0 auto;}
  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
    gap:12px;
    flex-wrap:wrap;
  }
  .counts{display:flex;gap:18px;font-family:var(--mono);font-size:12px;color:var(--muted);}
  .counts b{color:var(--text);font-weight:600;}
  button.refresh{
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    font-family:var(--mono);
    font-size:12px;
    padding:7px 14px;
    border-radius:6px;
    cursor:pointer;
    transition:border-color .15s, color .15s;
  }
  button.refresh:hover{border-color:var(--accent);color:var(--accent);}

  .empty{
    padding:60px 20px;
    text-align:center;
    color:var(--muted);
    font-family:var(--mono);
    font-size:13px;
    border:1px dashed var(--line);
    border-radius:10px;
  }
  .loading{
    padding:40px;
    text-align:center;
    color:var(--muted);
    font-family:var(--mono);
    font-size:13px;
  }

  .cards{display:flex;flex-direction:column;gap:10px;}
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px 20px;
    display:flex;
    flex-direction:column;
    gap:14px;
    transition:border-color .15s;
  }
  .card.vencida{border-color:rgba(214,109,80,0.5);}
  .card:hover{border-color:#394142;}

  .card-top{
    display:grid;
    grid-template-columns:1.3fr 1fr 1fr auto;
    gap:18px;
    align-items:center;
  }

  .producto{
    border-top:1px solid var(--line);
    padding-top:12px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .producto .producto-desc{
    font-size:13px;
    color:var(--text);
    line-height:1.4;
  }
  .producto .producto-desc.vacia{color:var(--muted);font-style:italic;}
  .producto .producto-meta{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{
    font-family:var(--mono);
    font-size:11px;
    padding:3px 9px;
    border-radius:20px;
    background:rgba(138,150,154,0.12);
    color:var(--muted);
    border:1px solid var(--line);
    white-space:nowrap;
  }
  .chip.precio{color:var(--accent);border-color:rgba(63,174,130,0.35);background:rgba(63,174,130,0.1);}
  .chip.pago{color:var(--warn);border-color:rgba(217,138,61,0.35);background:rgba(217,138,61,0.1);}

  .notas{
    border-top:1px solid var(--line);
    padding-top:12px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .notas label{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--muted);
  }
  .notas textarea{
    width:100%;
    min-height:52px;
    resize:vertical;
    background:#0d1010;
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--sans);
    font-size:13px;
    padding:9px 11px;
    border-radius:6px;
    outline:none;
    transition:border-color .15s;
  }
  .notas textarea:focus{border-color:var(--accent);}
  .notas-actions{display:flex;align-items:center;gap:10px;}
  .btn.nota{
    background:transparent;
    color:var(--accent);
    border:1px solid rgba(63,174,130,0.4);
    padding:6px 13px;
    font-size:12.5px;
  }
  .btn.nota:hover{background:rgba(63,174,130,0.1);}
  .nota-estado{
    font-family:var(--mono);
    font-size:11px;
    color:var(--muted);
  }

  .who .name{font-weight:600;font-size:14.5px;letter-spacing:0.1px;}
  .who .mail{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:3px;}
  .who .loc{font-size:12px;color:var(--muted);margin-top:6px;}

  .plan .row{font-size:12.5px;color:var(--text);margin-bottom:4px;}
  .plan .row span{color:var(--muted);}
  .plan .cedula{font-family:var(--mono);font-size:11.5px;color:var(--muted);}

  .status{display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
  .pill{
    font-family:var(--mono);
    font-size:11px;
    padding:3px 9px;
    border-radius:20px;
    display:inline-block;
  }
  .pill.pendiente{background:rgba(138,150,154,0.15);color:var(--muted);border:1px solid var(--line);}
  .pill.vencida{background:rgba(198,91,78,0.15);color:var(--danger);border:1px solid rgba(198,91,78,0.4);}
  .pill.activa{background:rgba(63,174,130,0.15);color:var(--accent);border:1px solid rgba(63,174,130,0.4);}
  .venc-date{font-family:var(--mono);font-size:11px;color:var(--muted);}

  .actions{display:flex;gap:8px;}
  .btn{
    font-family:var(--sans);
    font-size:13px;
    font-weight:600;
    padding:9px 16px;
    border-radius:7px;
    border:none;
    cursor:pointer;
    transition:filter .15s, transform .1s;
    white-space:nowrap;
  }
  .btn:active{transform:scale(0.97);}
  .btn.aprobar{background:var(--accent);color:#0c1211;}
  .btn.aprobar:hover{filter:brightness(1.08);}
  .btn.revertir{background:transparent;color:var(--danger);border:1px solid rgba(198,91,78,0.5);}
  .btn.revertir:hover{background:rgba(198,91,78,0.1);}
  .btn:disabled{opacity:0.5;cursor:default;}

  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--panel-alt);
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--mono);
    font-size:12.5px;
    padding:11px 20px;
    border-radius:8px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s, transform .2s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.err{border-color:rgba(198,91,78,0.5);color:var(--danger);}

  @media (max-width:820px){
    .card{grid-template-columns:1fr;gap:10px;}
    .actions{justify-content:flex-start;}
    .header-right{width:100%;justify-content:space-between;}
    .welcome{order:2;width:100%;}
  }

  .gear-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    width:32px;
    height:32px;
    border-radius:7px;
    cursor:pointer;
    font-size:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:border-color .15s, color .15s;
  }
  .gear-btn:hover{border-color:var(--accent);color:var(--accent);}
  .gear-btn.salir:hover{border-color:var(--danger);color:var(--danger);}

  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    width:100%;
    max-width:360px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:24px;
  }
  .modal h2{
    font-size:15px;
    font-weight:600;
    margin:0 0 16px;
  }
  .tabs{
    display:flex;
    gap:4px;
    margin-bottom:18px;
    border:1px solid var(--line);
    border-radius:8px;
    padding:3px;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:7px 0;
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--muted);
    border-radius:6px;
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .tab.active{background:var(--accent);color:#0c1211;}
  .modal-form{display:none;}
  .modal-form.active{display:block;}
  .modal label{
    display:block;
    font-family:var(--mono);
    font-size:11px;
    color:var(--muted);
    margin-bottom:5px;
    margin-top:14px;
  }
  .modal input{
    width:100%;
    background:#0d1010;
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--sans);
    font-size:13.5px;
    padding:9px 11px;
    border-radius:6px;
    outline:none;
    transition:border-color .15s;
  }
  .modal input:focus{border-color:var(--accent);}
  .modal .hint{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:5px;}
  .modal-actions{display:flex;gap:8px;margin-top:20px;}
  .modal-actions .btn{flex:1;}
  .btn.secondary{background:transparent;color:var(--muted);border:1px solid var(--line);}
  .btn.secondary:hover{border-color:#394142;color:var(--text);}
  .modal-error{
    margin-top:12px;
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--danger);
    display:none;
  }
  .modal-error.show{display:block;}
</style>
</head>
<body>

<header>
  <div class="title-block">
    <img src="icon-512.png" alt="Icono" class="icon" />
    <h1>Solicitudes de vendedor</h1>
    <span class="tag">admin</span>
  </div>
  <div class="header-right">
    <span class="welcome" id="welcomeMsg"></span>
    <span class="stamp" id="clock"></span>
    <div class="divider"></div>
    <button class="gear-btn" onclick="abrirModalCJ()" title="Importar producto de CJ">📦</button>
    <button class="gear-btn" onclick="abrirModal()" title="Gestión de admins">⚙</button>
    <button class="gear-btn salir" onclick="cerrarSesion()" title="Cerrar sesión">⏻</button>
  </div>
</header>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>Gestión de administradores</h2>
    <div class="tabs">
      <div class="tab active" id="tabRegistrar" onclick="cambiarTab('registrar')">Registrar admin</div>
      <div class="tab" id="tabActualizar" onclick="cambiarTab('actualizar')">Mis datos</div>
    </div>

    <form class="modal-form active" id="formRegistrar">
      <label for="rNombre">Nombre</label>
      <input type="text" id="rNombre" required>
      <label for="rCedula">Cédula</label>
      <input type="text" id="rCedula" required>
      <label for="rPassword">Contraseña</label>
      <input type="password" id="rPassword" required>
      <div class="modal-actions">
        <button type="button" class="btn secondary" onclick="cerrarModal()">Cancelar</button>
        <button type="submit" class="btn aprobar">Registrar</button>
      </div>
      <div class="modal-error" id="errorRegistrar"></div>
    </form>

    <form class="modal-form" id="formActualizar">
      <label for="aNombre">Nombre</label>
      <input type="text" id="aNombre" required>
      <label for="aPassword">Nueva contraseña</label>
      <input type="password" id="aPassword">
      <div class="hint">dejar en blanco para no cambiar la contraseña</div>
      <div class="modal-actions">
        <button type="button" class="btn secondary" onclick="cerrarModal()">Cancelar</button>
        <button type="submit" class="btn aprobar">Guardar</button>
      </div>
      <div class="modal-error" id="errorActualizar"></div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="modalCJOverlay">
  <div class="modal">
    <h2>Importar producto de CJ</h2>
    <form class="modal-form active" id="formImportarCJ">
      <label for="cjPid">PID del producto en CJ</label>
      <input type="text" id="cjPid" required placeholder="ej: 2608270215401610000">
      <div class="modal-actions">
        <button type="button" class="btn secondary" onclick="cerrarModalCJ()">Cancelar</button>
        <button type="submit" class="btn aprobar">Importar</button>
      </div>
      <div class="modal-error" id="errorImportarCJ"></div>
    </form>
    <div id="resultadoImportarCJ" style="display:none; margin-top:14px; font-family:var(--mono); font-size:12px; color:var(--muted); white-space:pre-wrap;"></div>
  </div>
</div>

<main>
  <div class="toolbar">
    <div class="counts">
      <span>pendientes <b id="countPendientes">–</b></span>
      <span>vencidas <b id="countVencidas">–</b></span>
    </div>
    <button class="refresh" onclick="cargar()">↻ actualizar</button>
  </div>

  <div id="contenido">
    <div class="loading">cargando solicitudes…</div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const ENDPOINT = '/admin/solicitudesVendedor';
const ADMIN_ENDPOINT = '/admin/gestionAdmins';
// Endpoint opcional para obtener los datos del admin logueado.
// Si tu backend no lo tiene todavía, el saludo usará el nombre
// guardado localmente al iniciar sesión (ver adminLogin.html).
const PERFIL_ENDPOINT = '/admin/perfil';
const LOGOUT_ENDPOINT = '/admin/logout';

function relojTick(){
  const ahora = new Date();
  document.getElementById('clock').textContent = ahora.toLocaleString('es-CR', {
    day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'
  });
}
relojTick();
setInterval(relojTick, 30000);

function toast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  setTimeout(() => t.classList.remove('show'), 2800);
}

function fmtFecha(f){
  if(!f) return '—';
  const d = new Date(f + 'T00:00:00');
  return d.toLocaleDateString('es-CR', {day:'2-digit', month:'short', year:'numeric'});
}

function pintarBienvenida(nombre){
  const el = document.getElementById('welcomeMsg');
  el.innerHTML = nombre ? `Bienvenido, <b>${esc(nombre)}</b>` : '';
}

async function cargarPerfil(){
  // 1) usamos lo que tengamos guardado como respuesta inmediata
  let nombre = sessionStorage.getItem('adminNombre');
  pintarBienvenida(nombre);

  // 2) intentamos refrescarlo contra el backend (silencioso si no existe el endpoint)
  try{
    const res = await fetch(PERFIL_ENDPOINT);
    if(res.status === 401){
      window.location.href = 'adminLogin.html';
      return;
    }
    if(res.ok){
      const data = await res.json();
      if(data && data.nombre){
        sessionStorage.setItem('adminNombre', data.nombre);
        pintarBienvenida(data.nombre);
      }
    }
  }catch(e){
    // si el endpoint no existe aún, no pasa nada: seguimos con el nombre guardado
  }
}

async function cerrarSesion(){
  if(!confirm('¿Cerrar sesión?')) return;
  try{
    await fetch(LOGOUT_ENDPOINT, {method:'POST'});
  }catch(e){
    // aunque falle la llamada, igual sacamos al usuario localmente
  }
  sessionStorage.removeItem('adminNombre');
  window.location.href = 'adminLogin.html';
}

async function cargar(){
  const contenido = document.getElementById('contenido');
  contenido.innerHTML = '<div class="loading">cargando solicitudes…</div>';
  try{
    const res = await fetch(ENDPOINT);
    if(res.status === 401){
      window.location.href = 'adminLogin.html';
      return;
    }
    if(!res.ok) throw new Error('el servidor respondió ' + res.status);
    const datos = await res.json();
    render(datos);
  }catch(e){
    contenido.innerHTML = `<div class="empty">No se pudo cargar la lista.<br>${e.message}</div>`;
  }
}

function render(items){
  const contenido = document.getElementById('contenido');
  const pendientes = items.filter(i => i.suscrito === 0 && i.vencida === 0);
  const vencidas = items.filter(i => i.vencida === 1);
  document.getElementById('countPendientes').textContent = pendientes.length;
  document.getElementById('countVencidas').textContent = vencidas.length;

  if(items.length === 0){
    contenido.innerHTML = '<div class="empty">No hay solicitudes pendientes ni suscripciones vencidas ahora mismo.</div>';
    return;
  }

  const cards = items.map(i => {
    const esVencida = i.vencida === 1;
    const pillClass = esVencida ? 'vencida' : 'pendiente';
    const pillText = esVencida ? 'vencida' : 'pendiente';

    const tieneDescripcion = i.descripcion && i.descripcion.trim().length > 0;
    const precioTexto = fmtPrecio(i.precio_promedio);

    return `
    <div class="card ${esVencida ? 'vencida' : ''}">
      <div class="card-top">
        <div class="who">
          <div class="name">${esc(i.nombre)}</div>
          <div class="mail">${esc(i.correo)}</div>
          <div class="loc">${esc(i.canton)}, ${esc(i.provincia)}</div>
        </div>
        <div class="plan">
          <div class="row"><span>tipo:</span> ${esc(i.tipo_suscripcion || '—')}</div>
          <div class="row"><span>tel:</span> ${esc(i.telefono || '—')}</div>
          <div class="cedula">céd. ${esc(i.cedula || '—')}</div>
        </div>
        <div class="status">
          <span class="pill ${pillClass}">${pillText}</span>
          <span class="venc-date">${esVencida ? 'venció ' + fmtFecha(i.fecha_vencimiento) : 'sin activar'}</span>
        </div>
        <div class="actions">
          <button class="btn aprobar" onclick="accionar(${i.usuario_id}, 'aprobar', this)">
            ${esVencida ? 'Renovar' : 'Aprobar'}
          </button>
          ${i.suscrito === 1 ? `<button class="btn revertir" onclick="accionar(${i.usuario_id}, 'revertir', this)">Revertir</button>` : ''}
        </div>
      </div>
      <div class="producto">
        <div class="producto-desc ${tieneDescripcion ? '' : 'vacia'}">${tieneDescripcion ? esc(i.descripcion) : 'sin descripción de productos'}</div>
        <div class="producto-meta">
          <span class="chip pago">pago: ${esc(i.metodo_pago || '—')}</span>
          <span class="chip precio">precio promedio: ${precioTexto}</span>
        </div>
      </div>
      <div class="notas">
        <label for="nota-${i.solicitud_id}">notas / observaciones</label>
        <textarea id="nota-${i.solicitud_id}" placeholder="ej: quedó en enviar más fotos, acordó bajar el precio, etc.">${esc(i.notas || '')}</textarea>
        <div class="notas-actions">
          <button class="btn nota" onclick="guardarNota(${i.solicitud_id}, this)">Guardar nota</button>
          <span class="nota-estado" id="nota-estado-${i.solicitud_id}"></span>
        </div>
      </div>
    </div>`;
  }).join('');

  contenido.innerHTML = `<div class="cards">${cards}</div>`;
}

function fmtPrecio(p){
  if(p === null || p === undefined || p === '') return '—';
  const n = Number(p);
  if(Number.isNaN(n)) return '—';
  return '₡' + n.toLocaleString('es-CR', {maximumFractionDigits: 0});
}

async function accionar(usuarioId, accion, btn){
  const fila = btn.closest('.card');
  fila.querySelectorAll('button').forEach(b => b.disabled = true);
  try{
    const res = await fetch(ENDPOINT, {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: `usuario_id=${encodeURIComponent(usuarioId)}&accion=${encodeURIComponent(accion)}`
    });
    if(res.status === 401){
      window.location.href = 'adminLogin.html';
      return;
    }
    const data = await res.json();
    if(!res.ok || data.error) throw new Error(data.error || 'error desconocido');
    toast(accion === 'aprobar' ? 'Suscripción activada' : 'Vendedor revertido a pendiente');
    cargar();
  }catch(e){
    toast('Error: ' + e.message, true);
    fila.querySelectorAll('button').forEach(b => b.disabled = false);
  }
}

function esc(s){
  if(s === null || s === undefined) return '';
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

async function guardarNota(solicitudId, btn){
  const textarea = document.getElementById('nota-' + solicitudId);
  const estado = document.getElementById('nota-estado-' + solicitudId);
  const nota = textarea.value;
  btn.disabled = true;
  estado.textContent = 'guardando…';
  try{
    const res = await fetch(ENDPOINT, {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: `solicitud_id=${encodeURIComponent(solicitudId)}&accion=nota&nota=${encodeURIComponent(nota)}`
    });
    if(res.status === 401){
      window.location.href = 'adminLogin.html';
      return;
    }
    const data = await res.json();
    if(!res.ok || data.error) throw new Error(data.error || 'error desconocido');
    estado.textContent = 'guardado ✓';
    setTimeout(() => { estado.textContent = ''; }, 2000);
  }catch(e){
    estado.textContent = 'error al guardar';
    toast('Error: ' + e.message, true);
  }finally{
    btn.disabled = false;
  }
}

// --- Modal de gestión de admins ---
function abrirModal(){
  // precargamos el nombre actual en la pestaña "Mis datos"
  const nombreActual = sessionStorage.getItem('adminNombre') || '';
  document.getElementById('aNombre').value = nombreActual;
  document.getElementById('modalOverlay').classList.add('show');
}
function cerrarModal(){
  document.getElementById('modalOverlay').classList.remove('show');
  document.getElementById('errorRegistrar').classList.remove('show');
  document.getElementById('errorActualizar').classList.remove('show');
}
function cambiarTab(tab){
  document.getElementById('tabRegistrar').classList.toggle('active', tab === 'registrar');
  document.getElementById('tabActualizar').classList.toggle('active', tab === 'actualizar');
  document.getElementById('formRegistrar').classList.toggle('active', tab === 'registrar');
  document.getElementById('formActualizar').classList.toggle('active', tab === 'actualizar');
}

document.getElementById('formRegistrar').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('errorRegistrar');
  errorBox.classList.remove('show');
  const nombre = document.getElementById('rNombre').value.trim();
  const cedula = document.getElementById('rCedula').value.trim();
  const password = document.getElementById('rPassword').value;

  try{
    const res = await fetch(ADMIN_ENDPOINT, {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: `accion=registrar&nombre=${encodeURIComponent(nombre)}&cedula=${encodeURIComponent(cedula)}&password=${encodeURIComponent(password)}`
    });
    if(res.status === 401){ window.location.href = 'adminLogin.html'; return; }
    const data = await res.json();
    if(!res.ok || data.error) throw new Error(data.error || 'error desconocido');
    toast('Admin registrado correctamente');

    cerrarModal();
  }catch(err){
    errorBox.textContent = err.message;

document.getElementById('formActualizar').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('errorActualizar');
  errorBox.classList.remove('show');
  const nombre = document.getElementById('aNombre').value.trim();
  const password = document.getElementById('aPassword').value;

  try{
    const res = await fetch(ADMIN_ENDPOINT, {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: `accion=actualizar&nombre=${encodeURIComponent(nombre)}&password=${encodeURIComponent(password)}`
    });
    if(res.status === 401){ window.location.href = 'adminLogin.html'; return; }
    const data = await res.json();
    if(!res.ok || data.error) throw new Error(data.error || 'error desconocido');
    toast('Datos actualizados');

    errorBox.textContent = err.message;

});

const IMPORTAR_CJ_ENDPOINT = '/admin/importarProductoCJ';

function abrirModalCJ(){
  document.getElementById('resultadoImportarCJ').style.display = 'none';
  document.getElementById('errorImportarCJ').classList.remove('show');
  document.getElementById('formImportarCJ').reset();
  document.getElementById('modalCJOverlay').classList.add('show');
}
function cerrarModalCJ(){
  document.getElementById('modalCJOverlay').classList.remove('show');
}

document.getElementById('formImportarCJ').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('errorImportarCJ');
  const resultadoBox = document.getElementById('resultadoImportarCJ');
  errorBox.classList.remove('show');
  resultadoBox.style.display = 'none';

  const pid = document.getElementById('cjPid').value.trim();
  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true;
  btn.textContent = 'Importando…';

  try{
    const res = await fetch(IMPORTAR_CJ_ENDPOINT, {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: `pid=${encodeURIComponent(pid)}`
    });
    if(res.status === 401){ window.location.href = 'adminLogin.html'; return; }
    const data = await res.json();
    if(!res.ok || data.ok === false) throw new Error(data.error || 'error desconocido');

    toast(`Producto importado — ${data.variantesImportadas} variantes, desde $${data.precioVentaDesde.toFixed(2)}`);
    resultadoBox.textContent = JSON.stringify(data, null, 2);
    resultadoBox.style.display = 'block';
  }catch(err){
    errorBox.textContent = err.message;
    errorBox.classList.add('show');
  }finally{
    btn.disabled = false;
    btn.textContent = 'Importar';
  }
});
